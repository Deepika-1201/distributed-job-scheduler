# The Prometheus that scrapes the platform and evaluates its alerts. Mounted into
# grafana/otel-lgtm by docker compose; the image's own datasources stay as they are.
apiVersion: 1

datasources:
  - name: Platform Prometheus
    type: prometheus
    uid: platform-prometheus
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 10s
