name: loadtest

# The load-test gate (LLD §19) on a clean runner: run it from the Actions tab or with
# `gh workflow run loadtest.yml`.
on:
  workflow_dispatch:
    inputs:
      burst_rate:
        description: Burst rate in jobs/s
        default: "5000"
      pools:
        description: Pools (1 measures a single pool's ceiling)
        default: "4"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      BURST_RATE: ${{ inputs.burst_rate }}
      POOLS: ${{ inputs.pools }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL (durable commits; memory and checkpoints tuned as in run.sh)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:17 \
            -c max_connections=200 -c shared_buffers=1GB -c max_wal_size=8GB -c checkpoint_timeout=30min \
            -c shared_preload_libraries=pg_stat_statements
          for _ in $(seq 60); do docker exec pg pg_isready -q -h localhost -U postgres && break; sleep 1; done
      - name: Environment
        run: |
          echo "$(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB memory; $(docker exec pg postgres --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the gate, sampling CPU and database waits during the burst
        run: |
          (sleep 50; for _ in 1 2 3 4; do
            echo "== $(date +%T) CPU by process"; top -b -n 1 -w 200 | sed -n '8,20p'
            echo "-- active database sessions by wait"
            docker exec pg psql -U postgres -AtF ' ' -c "SELECT coalesce(wait_event_type, 'CPU'), coalesce(wait_event, '-'), count(*)
              FROM pg_stat_activity WHERE backend_type = 'client backend' AND state <> 'idle' GROUP BY 1, 2 ORDER BY 3 DESC"
            sleep 5
          done) > /tmp/diag.txt 2>&1 &
          make loadtest
      - if: always()
        name: Diagnostics
        run: |
          cat /tmp/diag.txt
          docker exec pg psql -U postgres -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements' >/dev/null
          docker exec pg psql -U postgres -c "SELECT calls, round(total_exec_time) AS total_ms, round(mean_exec_time::numeric, 3) AS mean_ms,
            left(regexp_replace(query, '\s+', ' ', 'g'), 110) AS query
            FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 15"
          docker exec pg psql -U postgres -AtF ' ' -c "SELECT 'wal_bytes', wal_bytes, 'wal_fpi', wal_fpi, 'wal_records', wal_records FROM pg_stat_wal"
      - if: always()
        run: |
          { echo '```'; cat loadtest/out/gate.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-out
          path: |
            loadtest/out/*.log
            loadtest/out/*.txt
