version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
    ignore:
      # GO-2026-6443; stay on 1.83.x until a fixed release (LLD §20.6).
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: [/deploy/terraform/env, /deploy/terraform/bootstrap]
    schedule:
      interval: weekly
